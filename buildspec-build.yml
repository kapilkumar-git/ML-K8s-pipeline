version: 0.2

env:
  variables:
    ECR_REPO_NAME: "iris-classifier"

phases:
  pre_build:
    commands:
      - echo "Logging in to ECR..."
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO_NAME}
      - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-8)
      - if [ -z "$IMAGE_TAG" ]; then IMAGE_TAG=latest; fi

  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t ${ECR_URI}:${IMAGE_TAG} -t ${ECR_URI}:latest .

  post_build:
    commands:
      - echo "Pushing image to ECR..."
      - docker push ${ECR_URI}:${IMAGE_TAG}
      - docker push ${ECR_URI}:latest
      - echo "Writing image definitions for the next stage..."
      - printf '{"ECR_URI":"%s","IMAGE_TAG":"%s"}' "$ECR_URI" "$IMAGE_TAG" > image-details.json
      - cat image-details.json

artifacts:
  files:
    - image-details.json
    - buildspec-deploy.yml
    - k8s/**/*
